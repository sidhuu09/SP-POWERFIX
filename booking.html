<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service | SP POWERFIX</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:#0b0b0b;color:white;
  font-family:Arial,sans-serif
}
.container{max-width:600px;margin:25px auto}
.logo{text-align:center;color:#d4af37;font-size:27px;font-weight:bold}
.logo span{color:white}
.subtitle{text-align:center;color:#aaa;margin:8px 0 25px}
.form-card{
  background:#171717;padding:25px;border-radius:14px;
  border:1px solid #514322
}
h2{color:#d4af37;text-align:center;margin-top:0}
label{display:block;margin:15px 0 6px;font-size:14px}
input,select,textarea{
  width:100%;padding:13px;border-radius:6px;
  border:1px solid #555;background:#0b0b0b;
  color:white;font-size:15px
}
textarea{min-height:100px;resize:vertical}
button{
  width:100%;padding:14px;margin-top:22px;
  background:#d4af37;color:#111;border:0;
  border-radius:6px;font-size:16px;font-weight:bold
}
button:disabled{opacity:.6}
.back{display:block;text-align:center;color:#d4af37;margin-top:20px;text-decoration:none}
.note{font-size:12px;color:#aaa;text-align:center;margin-top:15px}
#message{text-align:center;font-size:14px;margin-top:15px;line-height:1.5}
</style>
</head>

<body>
<div class="container">

  <div class="logo">SP <span>POWERFIX</span></div>
  <p class="subtitle">SAFE • RELIABLE • PROFESSIONAL</p>

  <div class="form-card">
    <h2>BOOK A SERVICE</h2>

    <form id="bookingForm">
      <label>Customer Name *</label>
      <input type="text" id="customerName" placeholder="Enter full name" required>

      <label>Mobile Number *</label>
      <input type="tel" id="mobile" placeholder="10 digit mobile number"
        pattern="[0-9]{10}" maxlength="10" required>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter email">

      <label>Select Service *</label>
      <select id="service" required>
        <option value="">Choose Service</option>
        <option>Home Electrical Repair</option>
        <option>New Wiring Installation</option>
        <option>Fan Installation / Repair</option>
        <option>Light Installation</option>
        <option>Switch & Socket Repair</option>
        <option>MCB / Electrical Panel Work</option>
        <option>Emergency Electrical Service</option>
        <option>Other Electrical Work</option>
      </select>

      <label>Booking Date *</label>
      <input type="date" id="eventDate" required>

      <label>Preferred Time *</label>
      <input type="time" id="eventTime" required>

      <label>Full Service Address *</label>
      <textarea id="address" placeholder="Enter your village, area and full address" required></textarea>

      <label>Describe Your Electrical Problem *</label>
      <textarea id="details" placeholder="Explain what electrical work you need" required></textarea>

      <button type="submit" id="submitBtn">SUBMIT BOOKING REQUEST</button>
    </form>

    <div id="message"></div>

    <p class="note">
      Your booking request will be securely saved after submission.
    </p>
  </div>

  <a class="back" href="customer-dashboard.html">← Back to Dashboard</a>
</div>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  addDoc, collection, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const form = document.getElementById("bookingForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
  document.getElementById("email").value = user.email || "";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!currentUser) {
    message.style.color = "#ff6666";
    message.textContent = "Please login before booking.";
    return;
  }

  const bookingDate = document.getElementById("eventDate").value;

  if (bookingDate < new Date().toLocaleDateString("en-CA")) {
    message.style.color = "#ff6666";
    message.textContent = "Please select today or a future date.";
    return;
  }

  button.disabled = true;
  button.textContent = "SAVING BOOKING...";
  message.style.color = "#d4af37";
  message.textContent = "Please wait. Saving your booking...";

  try {
    await addDoc(collection(db, "bookings"), {
      uid: currentUser.uid,
      customerName: document.getElementById("customerName").value.trim(),
      mobile: document.getElementById("mobile").value.trim(),
      email: document.getElementById("email").value.trim() || currentUser.email || "",
      service: document.getElementById("service").value,
      eventDate: bookingDate,
      eventTime: document.getElementById("eventTime").value,
      address: document.getElementById("address").value.trim(),
      details: document.getElementById("details").value.trim(),
      status: "Pending",
      createdAt: serverTimestamp()
    });

    message.style.color = "#7CFC98";
    message.textContent = "Booking submitted successfully! Your status is Pending.";

    form.reset();
    document.getElementById("email").value = currentUser.email || "";

  } catch (error) {
    console.error("Booking error:", error);
    message.style.color = "#ff6666";
    message.textContent = "Booking failed: " + error.message;
  }

  button.disabled = false;
  button.textContent = "SUBMIT BOOKING REQUEST";
});
</script>

</body>
</html>
