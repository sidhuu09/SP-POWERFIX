
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP POWERFIX | Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.container{width:100%;max-width:440px;text-align:center}
.logo{font-size:30px;font-weight:bold;color:#d4af37}
.logo span{color:white}
.tag{color:#aaa;font-size:12px;letter-spacing:2px;margin:8px 0 25px}
.card{
  background:#171717;
  border:1px solid #514322;
  border-radius:14px;
  padding:25px;
  margin-bottom:18px;
}
h2{color:#d4af37;margin-bottom:18px}
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #555;
  background:#0b0b0b;
  color:white;
  font-size:15px;
}
button{
  width:100%;
  padding:13px;
  margin-top:12px;
  background:#d4af37;
  border:0;
  border-radius:6px;
  color:#111;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.register{
  display:block;
  color:#d4af37;
  margin-top:16px;
  text-decoration:none;
}
.back{color:#aaa;text-decoration:none}
.note{font-size:12px;color:#aaa;margin-top:15px}
</style>
</head>
<body>
<div class="container">

  <div class="logo">SP <span>POWERFIX</span></div>
  <div class="tag">SAFE • RELIABLE • PROFESSIONAL</div>

  <div class="card">
    <h2>Customer Login</h2>
    <form onsubmit="event.preventDefault(); alert('Customer login will be activated after Firebase setup.');">
      <input type="email" placeholder="Enter Email" required>
      <input type="password" placeholder="Enter Password" required>
      <button type="submit">CUSTOMER LOGIN</button>
    </form>
    <a class="register" href="register.html">Create New Customer Account</a>
  </div>

  <div class="card">
    <h2>Admin Login</h2>
    <form onsubmit="event.preventDefault(); alert('Secure Admin Login will be activated after Firebase setup.');">
      <input type="email" placeholder="Admin Email" required>
      <input type="password" placeholder="Admin Password" required>
      <button type="submit">ADMIN LOGIN</button>
    </form>
    <p class="note">Authorized Admin Only</p>
  </div>

  <a class="back" href="index.html">← Back to Home</a>
</div>
</body>
</html>
