<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | SP POWERFIX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial,sans-serif}
header{padding:18px 6%;background:#171717;border-bottom:1px solid #514322;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:23px;font-weight:bold;color:#d4af37}
.logo span{color:white}
main{max-width:950px;margin:auto;padding:25px 6%}
h2,h3{color:#d4af37}
.info{color:#aaa;font-size:14px}
.card{background:#171717;border:1px solid #514322;border-radius:12px;padding:20px;margin-top:20px;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #333;padding:10px 0}
.label{color:#aaa}
.value{color:white;text-align:right}
.status{color:#d4af37;font-weight:bold}
.btn{display:inline-block;background:#d4af37;color:#111;padding:11px 15px;border-radius:6px;text-decoration:none;font-weight:bold;margin-top:18px}
.back{color:#d4af37;text-decoration:none}
footer{text-align:center;padding:25px;color:#aaa;font-size:13px}
#message{margin-top:18px;line-height:1.5}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>
  <div class="logo">SP <span>POWERFIX</span></div>
  <a class="back" href="customer-dashboard.html">← Dashboard</a>
</header>

<main>
  <h2>MY BOOKINGS</h2>
  <p class="info">View your service booking details and progress.</p>
  <div id="message" class="info">Checking login...</div>
  <div id="bookings"></div>
  <a class="btn" href="booking.html">BOOK NEW SERVICE</a>
</main>

<footer>© 2026 SP POWERFIX | Electrician: MR SIDHU</footer>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const message = document.getElementById("message");
const bookingsBox = document.getElementById("bookings");

function safe(value) {
  return String(value ?? "—").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  message.textContent = "Loading your bookings...";

  try {
    const q = query(
      collection(db, "bookings"),
      where("uid", "==", user.uid)
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      message.textContent = "No bookings found. Book a service to see it here.";
      return;
    }

    const records = snapshot.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    records.sort((a, b) =>
      String(b.createdAt?.seconds || "").localeCompare(
        String(a.createdAt?.seconds || "")
      )
    );

    bookingsBox.innerHTML = records.map(b => `
      <div class="card">
        <h3>${safe(b.service || "Service Booking")}</h3>
        <div class="row"><span class="label">Booking ID</span><span class="value">${safe(b.id)}</span></div>
        <div class="row"><span class="label">Customer</span><span class="value">${safe(b.customerName)}</span></div>
        <div class="row"><span class="label">Mobile</span><span class="value">${safe(b.mobile)}</span></div>
        <div class="row"><span class="label">Booking Date</span><span class="value">${safe(b.eventDate)}</span></div>
        <div class="row"><span class="label">Preferred Time</span><span class="value">${safe(b.eventTime)}</span></div>
        <div class="row"><span class="label">Address</span><span class="value">${safe(b.address)}</span></div>
        <div class="row"><span class="label">Problem</span><span class="value">${safe(b.details)}</span></div>
        <div class="row"><span class="label">Booking Status</span><span class="status">${safe(b.status || "Pending")}</span></div>
        <p class="small">Payment details will appear here after payment tracking is connected.</p>
      </div>
    `).join("");

    message.textContent = "Your booking history is loaded.";

  } catch (error) {
    console.error(error);
    message.textContent = "Could not load bookings. Please check your connection or Firebase Rules.";
  }
});
</script>
</body>
</html>
